name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEUSMITH_PG_DSN_TEST: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e .
      - name: Unit + integration tests (PG included, pooling on)
        run: python -m unittest discover -s tests -v
      - name: Boundary selftest
        run: python demo.py --selftest
      - name: Params consistency
        run: python scripts/check_params.py
      - name: Schema real-engine check
        run: python scripts/check_sql.py
      - name: Probe gates (dev split)
        run: python scripts/eval_probes.py
