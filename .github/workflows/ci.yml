name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e .
      - name: Import all modules
        run: |
          python -c "
          import deusmith
          from deusmith import (params, models, algos, embeddings, llm, store,
                                shallow, pipeline, offline, evidence, retryhttp,
                                rerank, console, webconsole)
          print('14 modules OK, version', deusmith.__version__)
          "
      - name: Console smoke (REPL commands + rerank blend/fallback)
        run: |
          python -m deusmith.console --smoke
      - name: Web console smoke (HTTP API + page)
        run: |
          python -m deusmith.webconsole --smoke
      - name: End-to-end smoke (write -> retrieve -> inject)
        run: |
          python -c "
          from deusmith.embeddings import HashEmbedding
          from deusmith.llm import RuleBasedLLM
          from deusmith.pipeline import DeusmithMemory
          from deusmith.store import InMemoryStore
          mem = DeusmithMemory(store=InMemoryStore(), embedder=HashEmbedding(dim=64),
                               llm=RuleBasedLLM(), scope='ci/user')
          s = mem.session('ci-1')
          mem.write(s, '请记住：我对花粉过敏。')
          mem.write(s, '我喜欢摄影。')
          mem.write(s, '我现在住在上海。', source_auth=0.4)
          mem.write(s, '我现在住在北京。', source_auth=0.95)
          out = mem.inject_context(s, '用户的居住地和爱好')
          assert '北京' in out['user'], out['user']
          assert '摄影' in out['user'], out['user']
          print('E2E smoke OK, tokens =', out['tokens'])
          "
      - name: Offline governance smoke
        run: |
          python -c "
          from deusmith.embeddings import HashEmbedding
          from deusmith.llm import RuleBasedLLM
          from deusmith.offline import OfflineGovernor
          from deusmith.pipeline import DeusmithMemory
          from deusmith.store import InMemoryStore
          mem = DeusmithMemory(store=InMemoryStore(), embedder=HashEmbedding(dim=64),
                               llm=RuleBasedLLM(), scope='ci/user')
          s = mem.session('ci-2')
          for topic in ('摄影', '跑步', '烹饪', '书法'):
              mem.write(s, f'我喜欢{topic}。')
          report = OfflineGovernor(mem.store, mem.embedder, mem.llm).run('ci/user')
          expected = ('edges_decayed', 'edges_pruned', 'cycles_resolved',
                      'summaries_created', 'promoted_deep', 'archived',
                      'consistency_warnings', 'weights_renormalized',
                      'gini_weight', 'weight_monopoly_warning')
          for k in expected:
              assert k in report, f'缺少治理报告键: {k}'
          print('Offline governance OK:', report)
          "
